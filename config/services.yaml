services:
    _defaults:
        autowire: true
        autoconfigure: true

    Wizhippo\IbexaContentAssistant\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,WizhippoIbexaContentAssistantBundle.php}'

    Wizhippo\IbexaContentAssistant\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Accept provider-specific identifiers such as openai/gpt-6.1-terra.
    wizhippo_ibexa_content_assistant.model_catalog:
        class: Symfony\AI\Platform\Bridge\OpenResponses\FallbackModelCatalog

    Wizhippo\IbexaContentAssistant\Service\ContentAssistantService:
        autowire: true

    Wizhippo\IbexaContentAssistant\Service\ContentAssistantAccess:
        autowire: true
        arguments:
            $enabled: '%wizhippo_ibexa_content_assistant.enabled%'
            $allowedFields: '%wizhippo_ibexa_content_assistant.fields%'

    Wizhippo\IbexaContentAssistant\Ibexa\ContentAssistantComponent:
        autowire: true
        tags:
            - { name: ibexa.twig.component, group: admin-ui-content-edit-form-after }
