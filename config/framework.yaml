framework:
    http_client:
        scoped_clients:
            wizhippo_ibexa_content_assistant.http_client:
                base_uri: '%env(OPENAI_BASE_URL)%'
                # Restructuring a complete RichText field can take longer to generate.
                timeout: 120
                max_duration: 180
    rate_limiter:
        wizhippo_ibexa_content_assistant:
            policy: fixed_window
            limit: 10
            interval: '1 minute'

